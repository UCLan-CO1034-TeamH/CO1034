<!DOCTYPE html>
<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <title>TreasurePleasure</title>

    <link rel="stylesheet" href="css/style.css" />

  </head>

  <body>

    <span id="blockEnterName">
      <form
        id="formEnterName"
        onsubmit="enterName(); return false"
      >

        <p id="paragraphEnterName">Enter your name:</p>

        <input
          type="text"
          id="inputName"
          name="name"
          placeholder="Your name"
          required
        />

        <div>
          <input type="submit" value="Use this name">
        </div>

      </form>
    </span>

    <div id="mainMenuButtons" class="hidden">

      <p>Welcome, <span id="textName"></span>!</p>

      <div>
        <button id="browseOfficialGames" onclick="browseOfficialGames()">Browse official games</button>
      </div>

      <div>
        <button id="playSyntheticGame" onclick="playSyntheticGame()">Play a synthetic game</button>
      </div>
    </div>

    <p id="loading" class="hidden">Loading...</p>

    <p id="selectHunt" class="hidden">Select the hunt to play:</p>

    <div id="availableOfficialHunts">

    </div>

    <!-- <script src="js/app.js" type="module"></script> -->
     <script src="js/utils/http.js"></script>
     <script src="js/hunt/ActiveHunt.js"></script>
     <script src="js/hunt/AvailableHunt.js"></script>
     <script src="js/api/TreasureHuntApi.js"></script>
     <script src="js/app.js"></script>

  </body>

</html>
