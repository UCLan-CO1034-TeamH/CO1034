<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Border Buddy</title>

  <style>
    :root {
      --orange: #ef7b31;
      --white: #ffffff;
      --shadow: rgba(96, 45, 13, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: auto;
    }

    body {
      margin: 0;
      background: var(--orange);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      width: min(100%, 1050px);
      margin: 0 auto;
      padding: 24px 52px 30px;
    }

    /* Header */

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
    }

    .logo-main {
      color: var(--white);
    }

    .logo-muted {
      color: rgba(255, 255, 255, 0.28);
    }

    /* Buttons */

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      background: var(--white);
      color: var(--orange);
      cursor: pointer;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.1px;
      line-height: 1;
      text-decoration: none;
      box-shadow: 0 5px 0 var(--shadow);
      transition: transform 150ms ease;
    }

    .button:hover {
      transform: translateY(-4px);
    }

    .button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.75);
      outline-offset: 4px;
    }

    .header-button {
      min-height: 38px;
      padding: 0 20px;
      white-space: nowrap;
    }

    /* Hero */

    .hero {
      padding-top: 88px;
    }

    .hero-title {
      max-width: 590px;
      margin: 0;
      font-size: clamp(44px, 6vw, 59px);
      font-weight: 1000;
      letter-spacing: -3.5px;
      line-height: 0.84;
      text-transform: uppercase;
    }

    .hero-subtitle {
      max-width: 580px;
      margin: 13px 0 0;
      font-size: clamp(24px, 3vw, 33px);
      font-weight: 900;
      letter-spacing: -1.3px;
      line-height: 0.92;
    }

    .action-area {
      margin-top: 96px;
    }

    .action-label {
      margin: 0 0 38px;
      font-size: 20px;
      font-weight: 900;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 90px;
      padding: 0 100px;
    }

    .action-button {
      min-height: 45px;
      padding: 0 28px;
      text-transform: uppercase;
    }

    /* Information sections */

    .information {
      margin-top: 73px;
    }

    .info-row {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      align-items: center;
      gap: 78px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 31px;
      font-weight: 1000;
      letter-spacing: -1.4px;
      line-height: 1;
      text-transform: uppercase;
    }

    .section-copy {
      max-width: 560px;
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    /* Static car artwork */

    .car-frame {
      width: 100%;
      max-width: 225px;
      aspect-ratio: 1.05 / 1;
      justify-self: end;
      overflow: hidden;
      border-radius: 18px;
      background: #ececec;
    }

    .car-frame svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .broker-section {
      margin-top: 53px;
    }

    /* Contact form */

    .contact-card {
      margin-top: 57px;
      padding: 37px 105px 27px;
      border: 6px solid var(--white);
      border-radius: 58px;
    }

    .contact-title {
      margin: 0;
      text-align: center;
      font-size: 31px;
      font-weight: 1000;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .contact-intro {
      max-width: 650px;
      margin: 27px auto 14px;
      text-align: center;
      font-size: 12px;
      line-height: 1.25;
    }

    .field {
      display: block;
      margin-top: 11px;
    }

    .field-label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 900;
    }

    .form-control {
      display: block;
      width: 100%;
      border: 2px solid rgba(89, 89, 89, 0.35);
      border-radius: 4px;
      background: var(--white);
      color: #2f2f2f;
      font-size: 14px;
      font-weight: 400;
      outline: none;
      padding: 7px 10px;
    }

    input.form-control {
      height: 29px;
    }

    textarea.form-control {
      min-height: 72px;
      resize: none;
    }

    .submit-row {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    .submit-button {
      min-width: 118px;
      min-height: 43px;
      padding: 0 22px;
      text-transform: uppercase;
    }

    /* Footer */

    .site-footer {
      display: flex;
      align-items: flex-end;
      gap: 30px;
      margin-top: 54px;
      padding: 0 22px;
    }

    .footer-mark {
      color: rgba(255, 255, 255, 0.46);
      font-size: 54px;
      font-weight: 1000;
      letter-spacing: -8px;
      line-height: 0.75;
    }

    .copyright {
      margin: 0 0 1px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Responsive layout */

    @media (max-width: 760px) {
      .page {
        padding: 22px 24px 30px;
      }

      .site-header {
        align-items: flex-start;
      }

      .logo {
        font-size: 28px;
      }

      .header-button {
        min-height: 34px;
        padding: 0 14px;
        font-size: 10px;
      }

      .hero {
        padding-top: 70px;
      }

      .action-area {
        margin-top: 70px;
      }

      .action-buttons {
        grid-template-columns: 1fr;
        gap: 22px;
        padding: 0;
      }

      .info-row {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .car-frame {
        width: min(100%, 300px);
        max-width: none;
        justify-self: start;
      }

      .contact-card {
        padding: 34px 24px 28px;
        border-width: 5px;
        border-radius: 42px;
      }
    }

    @media (max-width: 480px) {
      .site-header {
        flex-direction: column;
      }

      .hero-title {
        font-size: 42px;
        letter-spacing: -2.5px;
      }

      .hero-subtitle {
        font-size: 25px;
      }

      .section-title,
      .contact-title {
        font-size: 27px;
      }

      .contact-card {
        padding-inline: 18px;
        border-radius: 34px;
      }

      .site-footer {
        padding: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="site-header">
      <div class="logo" aria-label="Border Buddy">
        <span class="logo-main">Treasure</span><span class="logo-muted">Pleasure</span>
      </div>

      <button class="button header-button" type="button">
        About us
      </button>

      <button class="button header-button" type="button">
        Follow us

    </header>

    <section class="hero">
      <h1 class="hero-title">
        Hunting a treasure<br />
        should be enjoyable.
      </h1>

      <p class="hero-subtitle">

        Try the app now.

      <div class="action-area">

        <div class="action-buttons">

    </section>

              <radialGradient id="headlamp">
                <stop offset="0" stop-color="#ffffff" />

            />

            <path

            />

            <path
              d="M138 102 L209 80 L224 149 L86 155 Z"

            />

            <path

            />

            <circle

            />

            <path

            <path

            />

            <path

            />

            <path
              d="M292 306 C315 294 339 294 364 307"

              stroke="#797979"
              stroke-width="11"
            />

            <path
              d="M246 184 L267 190 L266 238 L244 233 Z"
              fill="#eeeeee"

            />

            <path
              d="M25 339 C111 359 260 365 378 325"
              fill="none"
              stroke="#000000"
              stroke-width="12"
              opacity="0.8"
            />
          </svg>
        </div>
      </div>

      <div class="broker-section">
        <h2 class="section-title">Second question</h2>

        <p class="section-copy">
          Second answer.
        </p>
      </div>
    </section>

    <footer class="site-footer">
      <!-- <div class="footer-mark" aria-hidden="true">b</div>
      <p class="copyright">© 2018 BorderBuddy. All rights reserved.</p> -->
    </footer>
  </main>
</body>
</html>
